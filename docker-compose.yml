version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: geopulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse_secure_password
      POSTGRES_DB: geopulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopulse -d geopulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geopulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://geopulse:geopulse_secure_password@db:5432/geopulse_db
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geopulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgis_data:
